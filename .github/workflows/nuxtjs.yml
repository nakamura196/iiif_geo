# Deploy geo.ldas.jp (now redirects to IIIF Kasane + sample JSON) to GitHub Pages.
name: Deploy redirect site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # geo.ldas.jp moved into IIIF Kasane (/georef). The Nuxt app is no longer
      # built: the site is the sample JSON files in public/ (still fetched by
      # Kasane and by others through ?u=) plus redirect/index.html at every old
      # page path. 404.html catches any other path.
      - name: Assemble redirect site
        run: |
          set -eu
          mkdir -p _site
          cp -R public/. _site/
          for p in . ja en overlay ja/overlay en/overlay; do
            mkdir -p "_site/$p"
            cp redirect/index.html "_site/$p/index.html"
          done
          cp redirect/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    needs: build

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
